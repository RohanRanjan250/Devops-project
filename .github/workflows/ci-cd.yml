name: ClinicFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ---------- gate 1: tests + frontend build ----------
  test:
    name: Test backend + build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run pytest (fails the pipeline on any failing test)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------- gate 2: build, Trivy scan, push (tags = commit SHA) ----------
  build-scan-push:
    name: Build, scan and push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image names (registry paths must be lowercase)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/$OWNER/clinicflow-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/$OWNER/clinicflow-frontend" >> "$GITHUB_ENV"

      - name: Build images
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} ./backend
          docker build -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend

      - name: Trivy scan backend (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan frontend (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (SHA tags only, never latest)
        if: github.event_name != 'pull_request'
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:${{ github.sha }}

  # ---------- deploy: only when a cluster kubeconfig secret is configured ----------
  deploy:
    name: Deploy with Helm
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - uses: actions/checkout@v4
      - name: Image names (registry paths must be lowercase)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/$OWNER/clinicflow-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/$OWNER/clinicflow-frontend" >> "$GITHUB_ENV"
      - name: Skip when no cluster is configured
        if: env.KUBE_CONFIG_DATA == ''
        run: echo "KUBE_CONFIG_DATA secret not set - skipping deploy (images are published to GHCR)."
      - uses: azure/setup-helm@v4
        if: env.KUBE_CONFIG_DATA != ''
      - name: Configure kubectl
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: helm upgrade --install
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install clinicflow ./helm/clinicflow -n clinicflow \
            --set backend.image=$BACKEND_IMAGE --set backend.tag=${{ github.sha }} \
            --set frontend.image=$FRONTEND_IMAGE --set frontend.tag=${{ github.sha }} \
            --wait --timeout 5m
